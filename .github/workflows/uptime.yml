# 死活監視：公開サイト（gotouchireisyoku.com）と管理画面（dashboard）が応答しているかを10分おきに確かめる。
# どちらかが3回続けて失敗したらこのワークフローが「失敗」になり、GitHub から失敗の通知メールが届く
# （届く先は GitHub アカウントの通知設定 → Actions。既定で「失敗したときだけ」メールが来る）。
#
# データベースを使わないページ（robots.txt とログイン画面）だけを見る。Neon は5分アクセスが無いと止まり、
# アクセスがあると動き出して使用量（CU-hours）が増えるので、10分おきに起こすと無料枠を大きく使ってしまう。
# データベースの障害は、サイトや管理画面を使ったときのエラー通知（src/lib/alert.ts）で気づける。
# 手動で確かめたいときは https://gotouchireisyoku.com/api/health （データベースまで確認する）を開く。
#
# 注意：公開リポジトリの定期実行は、リポジトリに60日間コミットが無いと GitHub が自動で止める
# （止まる前にメールで知らせが来る。Actions の画面で「Enable workflow」を押せば再開できる）。
name: uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check pages
        shell: bash
        run: |
          set -u
          # 名前|URL|中身に含まれているはずの文字
          checks=(
            "公開サイト|https://gotouchireisyoku.com/robots.txt|Sitemap:"
            "管理画面|https://dashboard.gotouchireisyoku.com/login|ログイン"
          )
          failed=0
          for c in "${checks[@]}"; do
            IFS='|' read -r name url expect <<< "$c"
            ok=0
            for attempt in 1 2 3; do
              body=$(curl -sS -L --max-time 20 -w '\n%{http_code}' "$url" 2>&1) || true
              code=$(printf '%s' "$body" | tail -n1)
              if [ "$code" = "200" ] && printf '%s' "$body" | grep -qF "$expect"; then
                ok=1
                break
              fi
              echo "::warning::${name} ${attempt}回目: HTTP ${code}"
              sleep 20
            done
            if [ "$ok" = 1 ]; then
              echo "OK  ${name}  ${url}"
            else
              echo "::error::${name} が応答していません（${url}、最後の HTTP ${code}）"
              failed=1
            fi
          done
          exit $failed
